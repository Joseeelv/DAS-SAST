name: Semgrep Autofix PR

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semgrep-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Escanear y crear PRs individuales
        run: |
          # Ejecutar Semgrep y guardar resultados en JSON
          semgrep --config=auto --json --output=semgrep-results.json
          
          # Verificar si hay vulnerabilidades
          if [ ! -s semgrep-results.json ]; then
            echo "No se encontraron vulnerabilidades"
            exit 0
          fi
          
          # Obtener lista de archivos únicos con vulnerabilidades
          files=$(jq -r '.results[].path' semgrep-results.json | sort -u)
          
          for file in $files; do
            echo "Procesando archivo: $file"
            
            # Crear rama única para este archivo
            branch_name="semgrep-autofix-$(echo "$file" | tr '/' '-' | tr '.' '-')-$(date +%s)"
            git checkout -b "$branch_name"
            
            # Aplicar autofix solo para este archivo
            semgrep --config=auto --autofix "$file" || true
            
            # Verificar si hubo cambios
            if git diff --quiet "$file"; then
              echo "No hay cambios en $file, saltando..."
              git checkout main
              git branch -D "$branch_name"
              continue
            fi
            
            # Commit y push
            git add "$file"
            git commit -m "security: fix vulnerabilities in $file"
            git push origin "$branch_name"
            
            # Crear PR usando GitHub CLI
            gh pr create \
              --title "Solución automática en $file" \
              --body "Este PR soluciona vulnerabilidades detectadas por Semgrep en el archivo \`$file\`. Revisa los cambios antes de mergear." \
              --base main \
              --head "$branch_name"
            
            # Volver a main para el siguiente archivo
            git checkout main
            git branch -D "$branch_name"
          done
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}

      - name: Mostrar resumen
        run: |
          echo "Proceso completado. Revisa los PRs creados."
