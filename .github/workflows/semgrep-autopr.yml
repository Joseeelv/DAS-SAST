name: Semgrep Autofix PR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # una vez al día

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semgrep-autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semgrep-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip semgrep

      - name: Escanear y crear una PR por hallazgo
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_PRS: "10"   # límite de PRs por ejecución
        run: |
          set +e
          set -u

          git config user.name  "semgrep-autofix[bot]"
          git config user.email "semgrep-autofix@users.noreply.github.com"

          BASE_SHA=$(git rev-parse HEAD)
          echo "Rama por defecto: $DEFAULT_BRANCH | commit escaneado: $BASE_SHA"

          # Archivos temporales fuera del repo para que no se cuelen en los commits
          RESULTS="$RUNNER_TEMP/semgrep-results.json"
          FINDINGS="$RUNNER_TEMP/findings.jsonl"
          HELPER="$RUNNER_TEMP/fix_helper.py"

          # 1. Escaneo (sin ocultar errores)
          rc=0
          semgrep --config=auto --json --output="$RESULTS" || rc=$?
          if [ "$rc" -ne 0 ] || [ ! -s "$RESULTS" ]; then
            echo "::error::Semgrep falló (código $rc)"
            exit 1
          fi

          # 2. Solo hallazgos con fix disponible, uno por línea (JSONL)
          jq -c '.results[]
                 | select(.extra.fix != null)
                 | {check_id, path, start, end, fix: .extra.fix, message: .extra.message}' \
            "$RESULTS" > "$FINDINGS" || { echo "::error::Error procesando el JSON"; exit 1; }

          TOTAL=$(wc -l < "$FINDINGS")
          echo "Hallazgos con autofix: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "Nada que corregir"
            exit 0
          fi

          # Helper en Python: calcula la clave estable o aplica UN fix
          cat > "$HELPER" <<'PY'
          import hashlib, json, sys

          mode = sys.argv[1]
          f = json.load(sys.stdin)

          with open(f["path"], "rb") as fh:
              data = fh.read()

          s, e = f["start"]["offset"], f["end"]["offset"]
          if not (0 <= s <= e <= len(data)):
              sys.exit("offsets fuera de rango")

          if mode == "key":
              prefix = ("%s|%s|" % (f["check_id"], f["path"])).encode()
              print(hashlib.sha1(prefix + data[s:e]).hexdigest()[:12])
          elif mode == "apply":
              data = data[:s] + f["fix"].encode() + data[e:]
              with open(f["path"], "wb") as fh:
                  fh.write(data)
          else:
              sys.exit("modo desconocido")
          PY

          created=0

          # 3. Un hallazgo = una rama = una PR (fd 3 para que git/gh no consuman stdin)
          while IFS= read -r finding <&3; do
            if [ "$created" -ge "$MAX_PRS" ]; then
              echo "Límite de $MAX_PRS PRs alcanzado"
              break
            fi

            check_id=$(jq -r '.check_id'   <<<"$finding")
            file=$(jq -r '.path'           <<<"$finding")
            line=$(jq -r '.start.line'     <<<"$finding")
            message=$(jq -r '.message'     <<<"$finding")

            if [ ! -f "$file" ]; then
              echo "El archivo $file no existe, saltando"
              continue
            fi

            key=$(python "$HELPER" key <<<"$finding") || { echo "No se pudo calcular la clave, saltando"; continue; }
            branch="semgrep-fix/$key"

            echo "=== $check_id en $file:$line ($branch) ==="

            # Evitar duplicados: rama existente o PR (abierta, cerrada o mergeada)
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "La rama ya existe, saltando"
              continue
            fi
            existing=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              echo "Ya existe la PR #$existing para este hallazgo, saltando"
              continue
            fi

            # Siempre partir del commit escaneado (los offsets son válidos ahí)
            git checkout -q -f -B "$branch" "$BASE_SHA" || { echo "Error creando rama"; continue; }

            if ! python "$HELPER" apply <<<"$finding"; then
              echo "No se pudo aplicar el fix, saltando"
              git checkout -q -f "$BASE_SHA"; git branch -q -D "$branch"
              continue
            fi

            if git diff --quiet -- "$file"; then
              echo "El fix no produjo cambios, saltando"
              git checkout -q -f "$BASE_SHA"; git branch -q -D "$branch"
              continue
            fi

            git add -- "$file"
            if ! git commit -q -m "security: fix $check_id in $file:$line"; then
              echo "Error en commit"
              git checkout -q -f "$BASE_SHA"; git branch -q -D "$branch"
              continue
            fi

            if ! git push -q origin "$branch"; then
              echo "Error en push"
              git checkout -q -f "$BASE_SHA"; git branch -q -D "$branch"
              continue
            fi

            body=$(printf 'Semgrep detectó un problema y esta PR aplica su autofix.\n\n**Regla:** `%s`\n**Archivo:** `%s` (línea %s)\n\n%s\n\nRevisa el cambio antes de mergear.' \
              "$check_id" "$file" "$line" "$message")

            if gh pr create \
                 --base "$DEFAULT_BRANCH" \
                 --head "$branch" \
                 --title "fix(semgrep): ${check_id##*.} en $file:$line" \
                 --body "$body"; then
              created=$((created+1))
              echo "PR creada para $file:$line"
            else
              echo "Error creando la PR para $file:$line"
            fi

            git checkout -q -f "$BASE_SHA"
            git branch -q -D "$branch" || true
          done 3< "$FINDINGS"

          echo "PRs creadas en esta ejecución: $created"

      - name: Mostrar resumen
        if: always()
        run: echo "Proceso terminado. Revisa las PRs en la pestaña Pull Requests."
