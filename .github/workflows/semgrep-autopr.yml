name: Semgrep Autofix PR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # una vez al día; cada 5 min es excesivo

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semgrep-autofix-${{ github.ref }}
  cancel-in-progress: false   # evita cortar una ejecución a mitad de crear PRs

jobs:
  semgrep-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip semgrep

      - name: Escanear y crear una PR por hallazgo
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          MAX_PRS: "10"   # límite de PRs por ejecución
        run: |
          set -u
          git config user.name  "semgrep-autofix[bot]"
          git config user.email "semgrep-autofix@users.noreply.github.com"

          DEFAULT_BRANCH=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          BASE_SHA=$(git rev-parse HEAD)
          echo "Rama por defecto: $DEFAULT_BRANCH ($BASE_SHA)"

          # 1. Escaneo
          semgrep --config=auto --json --output=semgrep-results.json || true

          # 2. Solo hallazgos con fix disponible, uno por línea (JSONL)
          jq -c '.results[]
                 | select(.extra.fix != null)
                 | {check_id, path, start: .start, end: .end,
                    fix: .extra.fix, lines: .extra.lines,
                    message: .extra.message}' \
            semgrep-results.json > findings.jsonl

          TOTAL=$(wc -l < findings.jsonl)
          echo "Hallazgos con autofix: $TOTAL"
          [ "$TOTAL" -eq 0 ] && exit 0

          # Script que aplica UN fix usando los offsets
          cat > apply_fix.py <<'PY'
          import json, sys
          f = json.load(sys.stdin)
          with open(f["path"], "rb") as fh:
              data = fh.read()
          s, e = f["start"]["offset"], f["end"]["offset"]
          data = data[:s] + f["fix"].encode() + data[e:]
          with open(f["path"], "wb") as fh:
              fh.write(data)
          PY

          created=0

          # 3. Un bucle = un hallazgo = una PR (fd 3 para que git/gh no consuman stdin)
          while IFS= read -r finding <&3; do
            [ "$created" -ge "$MAX_PRS" ] && { echo "Límite de $MAX_PRS PRs alcanzado"; break; }

            check_id=$(jq -r '.check_id' <<<"$finding")
            file=$(jq -r '.path'     <<<"$finding")
            line=$(jq -r '.start.line' <<<"$finding")

            # Clave estable: regla + archivo + contenido de la línea (no cambia si se mueve de línea)
            key=$(jq -r '[.check_id, .path, .lines] | join("|")' <<<"$finding" | sha1sum | cut -c1-12)
            branch="semgrep-fix/$key"

            echo "=== $check_id en $file:$line ($branch) ==="

            # Evitar duplicados: rama existente o PR (abierta/cerrada/mergeada)
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "La rama ya existe, saltando"; continue
            fi
            if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[0].number')" ]; then
              echo "Ya existe una PR para este hallazgo, saltando"; continue
            fi

            # Siempre partir del mismo commit que se escaneó (los offsets son válidos ahí)
            git checkout -q -f -B "$branch" "$BASE_SHA"

            python apply_fix.py <<<"$finding"

            if git diff --quiet; then
              echo "El fix no produjo cambios, saltando"
              git checkout -q -f "$BASE_SHA"; git branch -q -D "$branch"; continue
            fi

            git add -A
            git commit -q -m "security: fix $check_id in $file:$line"

            if ! git push -q origin "$branch"; then
              echo "Error en push"
              git checkout -q -f "$BASE_SHA"; git branch -q -D "$branch"; continue
            fi

            message=$(jq -r '.message' <<<"$finding")
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "fix(semgrep): ${check_id##*.} en $file:$line" \
              --body "Semgrep detectó un problema y esta PR aplica su autofix.

          **Regla:** \`$check_id\`
          **Archivo:** \`$file\` (línea $line)

          $message

          Revisa el cambio antes de mergear." \
              && created=$((created+1))

            git checkout -q -f "$BASE_SHA"
            git branch -q -D "$branch" || true
          done 3< findings.jsonl

          echo "PRs creadas en esta ejecución: $created"
