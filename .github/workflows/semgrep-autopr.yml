name: Semgrep Autofix PR
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  semgrep-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar Semgrep y aplicar soluciones en el código
        # La bandera --autofix modifica físicamente los archivos vulnerables detectados
        run: semgrep --config=auto --autofix 

      - name: Crear Pull Request si hay cambios
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "security: solucionar vulnerabilidades detectadas por Semgrep"
          title: "⚠️ Solución automática de vulnerabilidades (Semgrep)"
          body: |
            Este es un PR automático generado por el pipeline de seguridad de Semgrep.
            Por favor, revisa los cambios sugeridos en el código antes de mergear a main.
          branch: semgrep-autofix-patches
          delete-branch: true
